<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Hockey Pool — Draft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/theme.js"></script>
</head>
<body>

<header>
  <h1>🏒 Fantasy Hockey Pool</h1>
  <nav class="tabs">
    <span class="active">Draft</span>
    <a href="standings.html">Standings</a>
    <a href="funfacts.html">Fun facts</a>
    <a href="pool-records.html">Record book</a>
  </nav>
  <span class="stamp" id="dataStamp"></span>
  <span class="spacer"></span>
  <button id="btnExport">Export JSON</button>
  <button id="btnImport">Import JSON</button>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</header>

<main class="split">
  <!-- ============ LEFT: poolers ============ -->
  <div class="panel">
    <h2>Poolers</h2>
    <div id="poolerList"></div>
    <div class="addrow">
      <input type="text" id="newPoolerName" placeholder="New pooler name" maxlength="30">
      <button class="primary" id="btnAddPooler">Add</button>
    </div>
  </div>

  <!-- ============ RIGHT: roster ============ -->
  <div class="panel" id="rosterPanel">
    <div class="empty-state">Add a pooler on the left to start entering picks.</div>
  </div>
</main>

<!-- Data first, then shared code, then the page's own code. These are plain
     <script src> tags, which a file:// page is allowed to load — fetch() of a
     local .json would be blocked by CORS, which is why the data ships as JS. -->
<script src="data/players.js"></script>
<script src="data/history.js"></script>
<script src="data/pool.js"></script>
<script src="assets/core.js"></script>
<script src="assets/draft.js"></script>
</body>
</html>
