    </div>
  </div>

  <div class="panel" id="rosterPanel">
    <div class="empty-state">Ajoutez un pooler à gauche pour commencer à entrer les choix.</div>
  </div>
</main>

<!-- Data first, then shared code, then the page's own code. These are plain
     <script src> tags, which a file:// page is allowed to load — fetch() of a
     local .json would be blocked by CORS, which is why the data ships as JS. -->
<!-- own: true — on repêche dans la liste de CETTE saison, vers le pool
     (vide) de cette saison. Les autres pages veulent plutôt un jeu de
     statistiques cohérent, quitte à montrer celles de l'an dernier. -->
<script>poolSeason.load(['players', 'history', 'pool'], { own: true });</script>
